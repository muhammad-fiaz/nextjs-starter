# Bun formatter configuration
[fmt]
printWidth = 100
tabWidth = 2
useTabs = false
semi = true
singleQuote = false
trailingComma = "all"
sortImports = true
sortTailwindcss = true
sortPackageJson = true

# Ignore patterns for formatting
ignorePatterns = [".next/**", "node_modules/**", "public/**", "bun.lock"]
